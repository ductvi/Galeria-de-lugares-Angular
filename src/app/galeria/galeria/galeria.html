<!--Filtros-->
<form #frm="ngForm">
    <div class="p-4 bg-white shadow">
        <div class="flex flex-col md:flex-row items-center justify-center gap-4">
            <input 
                type="text" name="nomeFiltro" [(ngModel)]="nomeFiltro"
                placeholder="Pesquisar pelo nome do local"
                class="w-full border border-gray-300 p-2 rounded shadow-sm focus:ring focus:ring-blue-400"
            >
            <select
            name="categoriaFiltro" [(ngModel)]="categoriaFiltro"
            class="w-full border border-gray-300 p-2 rounded shadow-sm focus:ring focus:ring-blue-400">
                <option value="-1">Todas as categorias</option>
                <option *ngFor="let cat of categoriasFiltro" [value]="cat.nome">{{ cat.nome }}</option>
            </select>

            <button (click)="filtrar()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-800">
                Pesquisar
            </button>
        </div>
    </div>
</form>

<!--Listagem Lugares-->
<div id="lugaresList" class="p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div class="bg-white shadow-md rounded-lg overflow-hidden border border-gray-200 flex flex-col justify-between" *ngFor="let lugar of lugares">
        <div>
            <!-- Foto do Lugar com fallback se o link estiver quebrado -->
            <img 
                [src]="lugar.urlFoto" 
                [alt]="lugar.nome" 
                class="w-full h-48 object-cover bg-gray-100"
                onerror="this.src='https://placehold.co/600x400?text=Sem+Foto'"
            >
            
            <!-- Conteúdo do Card -->
            <div class="p-4">
                <div class="flex items-center justify-between mb-2">
                    <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">
                        {{ lugar.categoria }}
                    </span>
                    <span class="text-yellow-500 font-bold text-sm">
                        ★ {{ lugar.avaliacao }}/5
                    </span>
                </div>
                
                <h3 class="text-xl font-bold text-gray-800 mb-1">{{ lugar.nome }}</h3>
                <p class="text-gray-600 text-sm flex items-center gap-1">
                    {{ lugar.localizacao }}
                </p>
            </div>
        </div>
    </div>

    <!-- Mensagem quando não houver lugares cadastrados -->
    <div *ngIf="lugares.length === 0" class="col-span-full text-center py-10 text-gray-500">
        Nenhum lugar cadastrado até o momento.
    </div>
</div>
