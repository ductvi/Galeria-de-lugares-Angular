<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg mt-5">
    <h2 class="text-2x1 font-semibold text-gray-700 mg-4">Novo Lugar</h2>
    <form id="lugarForm" [formGroup]="camposForm" (ngSubmit)="salvar()">
        <!--Nome-->
        <div class="mb-4">
            <label for="nome" class="block texto-gray-600 font-medium mb-2">Nome do lugar</label>
            <input 
                type="text"
                id="nome"
                name="nome"
                formControlName="nome"
                placeholder="Ex: Praia do sol, Restaurante estrela"
                class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400"
                required
            >
        </div>

        <!--Categoria-->
        <div class="mb-4">
            <label for="nome" class="block texto-gray-600 font-medium mb-2">Categoria</label>
        </div>

        <!--Localização-->
        <div class="mb-4">
            <label for="localizacao" class="block texto-gray-600 font-medium mb-2">Localização</label>
            <input 
                type="text"
                id="localizacao"
                name="localizacao"
                formControlName="localizacao"
                placeholder="Ex: São Paulo"
                class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400"
                required
            >
        </div>

        <!--urlFoto-->
        <div class="mb-4">
            <label for="urlFoto" class="block texto-gray-600 font-medium mb-2">Localização</label>
            <input 
                type="text"
                id="urlFoto"
                name="urlFoto"
                formControlName="urlFoto"
                placeholder="Ex: http://exemplo.com/foto.jpg"
                class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400"
                required
            >
        </div>

        <div class="mb-4">
            <label for="avaliacao" class="block texto-gray-600 font-medium mb-2">Avaliação</label>
        </div>
    </form>

    <!--Botão-->
    <button type="submit" 
    class="w-full bg-blue-600 text-white font-semibold p-3 rounded shadow hover:bg-blue-700">
        Cadastrar Lugar
    </button>
</div>
