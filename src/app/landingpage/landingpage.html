<div class="bg-gradient-to-r from-blue-500 to-blue-700 text-white flex flex-col justify-center items-center min-h-screen">
    <div class="text-center px-6 flex flex-col items-center">
        <h1 class="text-4xl font-bold mb-4">Bem-vindo à sua Lista de Lugares favoritos!</h1>
        <p class="mb-6">Explore, organize e compartilhe lugares que você adora. Tudo em um só lugar.</p>

        <!-- Botão exibido se estiver logado -->
        <button 
            *ngIf="isLoggedIn()" 
            (click)="navegar()"
            class="bg-white text-blue-600 font-semibold py-3 px-8 rounded-full hover:bg-gray-300 flex space-x-3 items-center shadow-md transition"
        >
            Olá {{ profile?.name }}, clique aqui para aproveitar o site
        </button>

        <!-- Botão exibido se NÃO estiver logado -->
        <button 
            *ngIf="!isLoggedIn()" 
            (click)="logarComGoogle()" 
            class="bg-white text-blue-700 font-semibold py-3 px-8 rounded-full hover:bg-gray-300 flex space-x-3 items-center shadow-md transition"
        >
            <img class="w-6 h-6 object-contain" src="https://cdn1.iconfinder.com/data/icons/google-s-logo/150/Google_Icons-09-512.png" alt="Logo Google">
            <span>Logar com Google</span>
        </button>
    </div>
</div>
